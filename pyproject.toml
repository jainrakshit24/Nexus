[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-eims"
version = "1.1.0"
description = "Engineering Intelligence & Memory System"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "tiktoken>=0.7"]
license = { text = "MIT" }

[project.scripts]
nexus = "nexus.cli:main"

[tool.setuptools.packages.find]
include = ["nexus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
